// O repo é um projeto Gradle de módulo único: este arquivo é a raiz e o app ao
// mesmo tempo. Antes ele só existia como módulo `app` dentro de um projeto do
// Android Studio que nunca foi versionado — o que impedia buildar em CI.
//
// Kotlin fixado aqui porque o AGP 9 compila Kotlin sozinho (sem plugin
// kotlin-android) e, sem o pin, usaria a versão que ele embarca.
buildscript {
    dependencies {
        classpath libs.kotlin.gradle.plugin
    }
}

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
}

// ASSINATURA DO RELEASE
//
// Sem isto, `assemblePrdRelease` produzia `app-prd-release-unsigned.apk` — um
// arquivo que o Android recusa instalar. A pegadinha é que o build NÃO falha:
// sai um APK aparentemente pronto que só revela o problema no aparelho, no
// momento de instalar, longe de quem buildou.
//
// A credencial nunca entra no repositório. Vem de `keystore.properties` (na raiz
// do módulo, ignorado pelo git) ou de variáveis de ambiente, para o mesmo
// build.gradle servir à máquina de quem desenvolve e a um runner de CI sem
// mudar uma linha. Ver keystore.properties.example.
def keystoreProps = new Properties()
def keystorePropsFile = file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Propriedade do arquivo > -P na linha de comando > variável de ambiente.
def signingValue = { String key, String env ->
    keystoreProps.getProperty(key) ?: project.findProperty(key) ?: System.getenv(env)
}

def storeFilePath  = signingValue('storeFile',     'UHFLOGGER_STORE_FILE')?.toString()
def storePasswordV = signingValue('storePassword', 'UHFLOGGER_STORE_PASSWORD')?.toString()
def keyAliasV      = signingValue('keyAlias',      'UHFLOGGER_KEY_ALIAS')?.toString()
def keyPasswordV   = signingValue('keyPassword',   'UHFLOGGER_KEY_PASSWORD')?.toString()

// Só assina quando TUDO está presente e o keystore existe de fato. Configuração
// pela metade produziria um erro de Gradle obscuro no meio do build; aqui a
// ausência é um caminho previsto, com aviso, e o APK de debug segue funcionando
// para quem só quer rodar no aparelho.
def canSignRelease = storeFilePath != null && !storeFilePath.trim().isEmpty() &&
        file(storeFilePath).exists() &&
        storePasswordV != null && keyAliasV != null && keyPasswordV != null

if (!canSignRelease) {
    logger.warn(
        "[uhflogger] Sem credenciais de assinatura — os APKs de RELEASE sairao " +
        "UNSIGNED e nao instalam. Para assinar, crie keystore.properties " +
        "(veja keystore.properties.example). Builds de DEBUG nao sao afetados."
    )
}

// CHAVE K DA SMARTBOX (BLE) — ver smartbox/ble/FieldKey.kt e docs/smartbox.md
//
// Confidencial: nunca no Git, em log ou em chat. Vem de fora, igual às
// credenciais de assinatura: `smartbox.bleKey` no local.properties (ignorado
// pelo git) > -PSMARTBOX_BLE_KEY > variável de ambiente SMARTBOX_BLE_KEY (o
// secret do GitHub Actions). Mesma chave em hml e prd: ela é do firmware, não
// do backend.
//
// Sem chave (ou com valor fora do formato) o build NÃO falha: o app sai com a
// Smartbox desligada e o aviso na tela. Só aceita 64 hex, o que também impede
// que um valor estranho quebre o Java gerado do BuildConfig. O Gradle nunca
// imprime o valor, só se ela está presente.
def localProps = new Properties()
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def smartboxKeyRaw = (localProps.getProperty('smartbox.bleKey')
        ?: project.findProperty('SMARTBOX_BLE_KEY')
        ?: System.getenv('SMARTBOX_BLE_KEY'))?.toString()?.trim()
def smartboxKey = (smartboxKeyRaw != null && smartboxKeyRaw ==~ /[0-9a-fA-F]{64}/) ? smartboxKeyRaw.toLowerCase() : ''
if (smartboxKey.isEmpty()) {
    logger.warn(
        "[uhflogger] Chave BLE da smartbox ausente ou invalida — o APK sai com a " +
        "Smartbox desligada. Configure smartbox.bleKey no local.properties ou o " +
        "secret SMARTBOX_BLE_KEY (veja docs/smartbox.md)."
    )
}

android {
    namespace 'com.uhflogger'
    compileSdk 34

    defaultConfig {
        applicationId "com.uhflogger"
        minSdk 26
        targetSdk 34
        // No CI cada build ganha um versionCode maior que o anterior, sem bump
        // manual — o Android recusa instalar por cima de versionCode menor. O
        // offset 100 deixa o primeiro build de CI acima do 14 já em campo.
        // Local continua 14: build de máquina não é para distribuir.
        def ciBuildNumber = System.getenv('GITHUB_RUN_NUMBER')?.toInteger()
        versionCode ciBuildNumber ? 100 + ciBuildNumber : 14
        versionName "1.4.0" + (ciBuildNumber ? "-b${ciBuildNumber}" : "")

        buildConfigField "String", "SMARTBOX_BLE_KEY", "\"${smartboxKey}\""
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile     file(storeFilePath)
                storePassword storePasswordV
                keyAlias      keyAliasV
                keyPassword   keyPasswordV
                // v1 continua ligado por causa do minSdk 26: o esquema v2/v3
                // sozinho basta a partir do Android 7, mas manter v1 não custa
                // nada e evita surpresa em aparelho antigo de campo.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sem credencial, simplesmente não se atribui: o release sai
            // unsigned como antes, com o aviso emitido lá em cima explicando por
            // quê. Atribuir `null` daria no mesmo, mas depende de dispatch que
            // já mudou entre versões do AGP.
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Ambiente é propriedade do ARTEFATO, não uma configuração de tela.
    //
    // Mesmo padrão do app de campo (spacevis-mobile), onde o eas.json define
    // EXPO_PUBLIC_API_URL por perfil de build e o app não tem campo de servidor.
    // Aqui: dois flavors, cada um com sua URL compilada. Sai um APK de
    // homologação e um de produção, e ninguém em campo escolhe (nem erra) para
    // onde os dados vão.
    //
    // applicationId IGUAL nos dois de propósito: o cliente OAuth do Google Drive
    // é atrelado ao package + SHA-1, então um sufixo (.hml) quebraria o login do
    // Drive no build de homologação — e o Drive é destino de primeira classe
    // aqui. Consequência aceita: um app por vez no aparelho.
    flavorDimensions "ambiente"
    productFlavors {
        hml {
            dimension "ambiente"
            versionNameSuffix "-hml"
            resValue "string", "app_name", "UHF Logger HML"
            buildConfigField "String", "API_BASE_URL",
                '"https://backend-cattlevis-q3zndqt2pq-uc.a.run.app"'
            // Vazio = Analytics no-op: homologação não suja o projeto de produção.
            buildConfigField "String", "MIXPANEL_TOKEN", '""'
        }
        prd {
            dimension "ambiente"
            resValue "string", "app_name", "UHF Logger"
            buildConfigField "String", "API_BASE_URL",
                '"https://backend-cattlevis-3p6nhqmpoa-uc.a.run.app"'
            // Token PÚBLICO de cliente do Mixpanel (vai em todo APK por
            // natureza; não é segredo). Mesmo projeto do spacevis-mobile — ver
            // docs/analytics.md.
            buildConfigField "String", "MIXPANEL_TOKEN",
                '"d05f0d7bd6ebdaf85ad1cd0372fbe372"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        // Necessário pro BuildConfig.API_BASE_URL: a partir do AGP 8 o
        // BuildConfig não é mais gerado por padrão.
        buildConfig true
        // Necessário pro resValue nos productFlavors: a partir do AGP 8 a
        // geração de resource values também é opt-in.
        resValues true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    testImplementation libs.junit
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    // org.json real nos testes de JVM: o do android.jar é stub e lança "not mocked".
    testImplementation 'org.json:json:20240303'

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // Google Drive API
    implementation 'com.google.apis:google-api-services-drive:v3-rev20240123-2.0.0'
    implementation 'com.google.api-client:google-api-client-android:2.4.0'
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Telemetria de conexão do leitor — ver docs/analytics.md
    implementation 'com.mixpanel.android:mixpanel-android:8.11.1'

    // Room — KSP 2.3.9 + Room 2.7.1 + Kotlin 2.3.21 + AGP 9.2.1
    implementation libs.room.runtime
    ksp libs.room.compiler
}