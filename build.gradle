plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
}

// ASSINATURA DO RELEASE
//
// Sem isto, `assemblePrdRelease` produzia `app-prd-release-unsigned.apk` — um
// arquivo que o Android recusa instalar. A pegadinha é que o build NÃO falha:
// sai um APK aparentemente pronto que só revela o problema no aparelho, no
// momento de instalar, longe de quem buildou.
//
// A credencial nunca entra no repositório. Vem de `keystore.properties` (na raiz
// do módulo, ignorado pelo git) ou de variáveis de ambiente, para o mesmo
// build.gradle servir à máquina de quem desenvolve e a um runner de CI sem
// mudar uma linha. Ver keystore.properties.example.
def keystoreProps = new Properties()
def keystorePropsFile = file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Propriedade do arquivo > -P na linha de comando > variável de ambiente.
def signingValue = { String key, String env ->
    keystoreProps.getProperty(key) ?: project.findProperty(key) ?: System.getenv(env)
}

def storeFilePath  = signingValue('storeFile',     'UHFLOGGER_STORE_FILE')?.toString()
def storePasswordV = signingValue('storePassword', 'UHFLOGGER_STORE_PASSWORD')?.toString()
def keyAliasV      = signingValue('keyAlias',      'UHFLOGGER_KEY_ALIAS')?.toString()
def keyPasswordV   = signingValue('keyPassword',   'UHFLOGGER_KEY_PASSWORD')?.toString()

// Só assina quando TUDO está presente e o keystore existe de fato. Configuração
// pela metade produziria um erro de Gradle obscuro no meio do build; aqui a
// ausência é um caminho previsto, com aviso, e o APK de debug segue funcionando
// para quem só quer rodar no aparelho.
def canSignRelease = storeFilePath != null && !storeFilePath.trim().isEmpty() &&
        file(storeFilePath).exists() &&
        storePasswordV != null && keyAliasV != null && keyPasswordV != null

if (!canSignRelease) {
    logger.warn(
        "[uhflogger] Sem credenciais de assinatura — os APKs de RELEASE sairao " +
        "UNSIGNED e nao instalam. Para assinar, crie keystore.properties " +
        "(veja keystore.properties.example). Builds de DEBUG nao sao afetados."
    )
}

android {
    namespace 'com.uhflogger'
    compileSdk 34

    defaultConfig {
        applicationId "com.uhflogger"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "1.3.1"
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile     file(storeFilePath)
                storePassword storePasswordV
                keyAlias      keyAliasV
                keyPassword   keyPasswordV
                // v1 continua ligado por causa do minSdk 26: o esquema v2/v3
                // sozinho basta a partir do Android 7, mas manter v1 não custa
                // nada e evita surpresa em aparelho antigo de campo.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sem credencial, simplesmente não se atribui: o release sai
            // unsigned como antes, com o aviso emitido lá em cima explicando por
            // quê. Atribuir `null` daria no mesmo, mas depende de dispatch que
            // já mudou entre versões do AGP.
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Ambiente é propriedade do ARTEFATO, não uma configuração de tela.
    //
    // Mesmo padrão do app de campo (spacevis-mobile), onde o eas.json define
    // EXPO_PUBLIC_API_URL por perfil de build e o app não tem campo de servidor.
    // Aqui: dois flavors, cada um com sua URL compilada. Sai um APK de
    // homologação e um de produção, e ninguém em campo escolhe (nem erra) para
    // onde os dados vão.
    //
    // applicationId IGUAL nos dois de propósito: o cliente OAuth do Google Drive
    // é atrelado ao package + SHA-1, então um sufixo (.hml) quebraria o login do
    // Drive no build de homologação — e o Drive é destino de primeira classe
    // aqui. Consequência aceita: um app por vez no aparelho.
    flavorDimensions "ambiente"
    productFlavors {
        hml {
            dimension "ambiente"
            versionNameSuffix "-hml"
            resValue "string", "app_name", "UHF Logger HML"
            buildConfigField "String", "API_BASE_URL",
                '"https://backend-cattlevis-q3zndqt2pq-uc.a.run.app"'
        }
        prd {
            dimension "ambiente"
            resValue "string", "app_name", "UHF Logger"
            buildConfigField "String", "API_BASE_URL",
                '"https://backend-cattlevis-3p6nhqmpoa-uc.a.run.app"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        // Necessário pro BuildConfig.API_BASE_URL: a partir do AGP 8 o
        // BuildConfig não é mais gerado por padrão.
        buildConfig true
        // Necessário pro resValue nos productFlavors: a partir do AGP 8 a
        // geração de resource values também é opt-in.
        resValues true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    testImplementation libs.junit

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // Google Drive API
    implementation 'com.google.apis:google-api-services-drive:v3-rev20240123-2.0.0'
    implementation 'com.google.api-client:google-api-client-android:2.4.0'
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Room — KSP 2.3.9 + Room 2.7.1 + Kotlin 2.3.21 + AGP 9.2.1
    implementation libs.room.runtime
    ksp libs.room.compiler
}