name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Debug de homologação: não precisa de keystore, então PR de fork também
      # roda. O que importa aqui é compilar e passar nos testes.
      - name: Test + build (hmlDebug)
        run: ./gradlew testHmlDebugUnitTest assembleHmlDebug
